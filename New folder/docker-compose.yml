version: '3.8'

services:
  app:
    build: .
    container_name: smart_attendance_app
    restart: always
    ports:
      - "80:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=attendance_db
      - DB_USERNAME=attendance_user
      - DB_PASSWORD=attendance_pass
    depends_on:
      - db
    volumes:
      - ./database:/var/www/html/database

  db:
    image: mysql:8.0
    container_name: smart_attendance_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: attendance_db
      MYSQL_USER: attendance_user
      MYSQL_PASSWORD: attendance_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
