services:
  - type: web
    name: smart-attendance-system
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: "Smart Attendance Server"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_TIMEZONE
        value: "Asia/Kolkata"
      - key: SESSION_LIFETIME
        value: 120
      - key: EMPLOYEE_CODE_PREFIX
        value: "EMP-"
    # ─────────────────────────────────────────────────────────────────────────
    # NOTE: Render Persistent Disks only mount on Paid plans (Starter $7/mo+).
    # On Render FREE plan, set DATABASE_URL in Render -> Environment to a free
    # Neon.tech or Supabase PostgreSQL URL for 100% permanent data + photos!
    # Mount path /var/data preserves /var/www/html/database/Database.php safely.
    # ─────────────────────────────────────────────────────────────────────────
    disk:
      name: attendance-data
      mountPath: /var/data
      sizeGB: 1
