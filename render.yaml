services:
  - type: web
    name: smart-attendance-system
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: "Smart Attendance Server"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_TIMEZONE
        value: "Asia/Kolkata"
      - key: SESSION_LIFETIME
        value: 120
      - key: EMPLOYEE_CODE_PREFIX
        value: "EMP-"
      - key: DATABASE_URL
        fromDatabase:
          name: smart-attendance-db
          property: connectionString

databases:
  - name: smart-attendance-db
    databaseName: attendance_db
    user: attendance_user
    plan: free
    region: singapore
