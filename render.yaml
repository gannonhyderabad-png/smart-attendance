services:
  - type: web
    name: smart-attendance-system
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: "Smart Attendance Server"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_TIMEZONE
        value: "Asia/Kolkata"
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_SQLITE_PATH
        value: /var/www/html/database/attendance.sqlite
      - key: SESSION_LIFETIME
        value: 120
      - key: EMPLOYEE_CODE_PREFIX
        value: "EMP-"
    # ─────────────────────────────────────────────────────────────────────────
    # Render Persistent Disk — survives ALL redeploys and restarts.
    # Mount path /var/www/html/database stores:
    #   - attendance.sqlite  (your database)
    #   - _uploads/          (all selfie photos, avatars, documents)
    # ─────────────────────────────────────────────────────────────────────────
    disk:
      name: attendance-data
      mountPath: /var/www/html/database
      sizeGB: 1
